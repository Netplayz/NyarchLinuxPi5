name: Build NyarchLinux for Raspberry Pi 5 (Production)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        type: boolean
        default: false
      image_size:
        description: 'Image size (e.g., 6G, 8G, 10G)'
        required: false
        type: string
        default: '8G'
      skip_tests:
        description: 'Skip image validation tests'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

env:
  IMAGE_NAME: NyarchLinux-Pi5
  IMAGE_SIZE: ${{ github.event.inputs.image_size || '8G' }}
  BUILD_DATE: ${{ github.run_number }}
  DEBIAN_FRONTEND: noninteractive

jobs:
  validate:
    name: Validate Build Configuration
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      build_version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Validate image size
      id: check
      run: |
        SIZE="${{ env.IMAGE_SIZE }}"
        if [[ ! $SIZE =~ ^[0-9]+[GMK]$ ]]; then
          echo "::error::Invalid image size format: $SIZE"
          exit 1
        fi
        
        # Extract numeric value
        NUM=$(echo $SIZE | sed 's/[GMK]$//')
        UNIT=$(echo $SIZE | sed 's/^[0-9]*//')
        
        # Convert to GB for validation
        case $UNIT in
          G) SIZE_GB=$NUM ;;
          M) SIZE_GB=$(awk "BEGIN {print $NUM/1024}") ;;
          K) SIZE_GB=$(awk "BEGIN {print $NUM/1048576}") ;;
        esac
        
        # Minimum 4GB, maximum 16GB
        if (( $(echo "$SIZE_GB < 4" | bc -l) )); then
          echo "::error::Image size too small (minimum 4G)"
          exit 1
        fi
        if (( $(echo "$SIZE_GB > 16" | bc -l) )); then
          echo "::error::Image size too large (maximum 16G, would exceed runner disk space)"
          exit 1
        fi
        
        echo "should_build=true" >> $GITHUB_OUTPUT
        echo "✅ Image size validated: $SIZE ($SIZE_GB GB)"
    
    - name: Generate version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(date +%Y.%m.%d)-build${{ github.run_number }}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Build version: $VERSION"
    
    - name: Check for package list
      run: |
        if [ ! -f "packages.aarch64" ]; then
          echo "::warning::packages.aarch64 not found, will use default packages"
        else
          echo "✅ Found packages.aarch64"
          wc -l packages.aarch64
        fi

  build:
    name: Build Pi5 Image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up build environment
      run: |
        echo "🔧 Setting up build environment"
        echo "BUILD_VERSION=${{ needs.validate.outputs.build_version }}" >> $GITHUB_ENV
        echo "WORK_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV
        echo "OUTPUT_DIR=${GITHUB_WORKSPACE}/output" >> $GITHUB_ENV
        echo "LOG_DIR=${GITHUB_WORKSPACE}/logs" >> $GITHUB_ENV
        
        # Create directories
        mkdir -p "${GITHUB_WORKSPACE}"/{build/{boot,root},output,logs}
    
    - name: Free up disk space
      run: |
        echo "💾 Freeing up disk space..."
        df -h
        
        # Remove large unnecessary packages
        sudo apt-get remove -y \
          '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
          azure-cli google-cloud-sdk google-chrome-stable firefox \
          powershell mono-devel || true
        
        sudo apt-get autoremove -y
        sudo apt-get clean
        
        # Remove large directories
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost \
          "$AGENT_TOOLSDIRECTORY"
        
        # Clear docker
        docker system prune -af || true
        
        echo "✅ Disk space after cleanup:"
        df -h
        
        # Ensure we have at least 12GB free
        FREE_GB=$(df / --output=avail | tail -n1 | awk '{print int($1/1024/1024)}')
        if [ $FREE_GB -lt 12 ]; then
          echo "::error::Insufficient disk space: ${FREE_GB}GB free (need at least 12GB)"
          exit 1
        fi
        echo "✅ Available space: ${FREE_GB}GB"
    
    - name: Install dependencies
      run: |
        echo "📦 Installing dependencies..."
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          qemu-user-static \
          binfmt-support \
          arch-install-scripts \
          parted \
          dosfstools \
          e2fsprogs \
          wget \
          curl \
          kpartx \
          pigz \
          pv \
          bc
        
        echo "✅ Dependencies installed"
    
    - name: Verify QEMU ARM64 support
      run: |
        echo "🔍 Verifying QEMU ARM64 emulation..."
        
        if [ ! -f /usr/bin/qemu-aarch64-static ]; then
          echo "::error::QEMU ARM64 static binary not found"
          exit 1
        fi
        
        # Test QEMU
        if ! /usr/bin/qemu-aarch64-static --version; then
          echo "::error::QEMU ARM64 binary not working"
          exit 1
        fi
        
        # Check binfmt registration
        if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
          echo "✅ ARM64 binfmt_misc registered:"
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
        else
          echo "⚠️  ARM64 binfmt_misc not registered, setting up..."
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        fi
        
        echo "✅ QEMU ARM64 verification complete"
    
    - name: Download Arch Linux ARM
      run: |
        echo "⬇️  Downloading Arch Linux ARM..."
        
        TARBALL="ArchLinuxARM-rpi-aarch64-latest.tar.gz"
        URL="http://os.archlinuxarm.org/os/$TARBALL"
        
        # Download with retry
        for i in {1..3}; do
          if wget -q --show-progress --timeout=60 --tries=3 -O "$TARBALL" "$URL"; then
            echo "✅ Download successful"
            break
          fi
          echo "⚠️  Download attempt $i failed, retrying..."
          sleep 10
          if [ $i -eq 3 ]; then
            echo "::error::Failed to download Arch Linux ARM after 3 attempts"
            exit 1
          fi
        done
        
        # Verify download
        if [ ! -f "$TARBALL" ]; then
          echo "::error::Tarball not found after download"
          exit 1
        fi
        
        SIZE=$(du -h "$TARBALL" | cut -f1)
        echo "📦 Downloaded: $TARBALL ($SIZE)"
        
        # Basic integrity check
        if ! tar -tzf "$TARBALL" > /dev/null 2>&1; then
          echo "::error::Downloaded tarball is corrupted"
          exit 1
        fi
        
        echo "✅ Tarball integrity verified"
    
    - name: Create disk image
      run: |
        echo "💿 Creating disk image..."
        
        IMAGE_FILE="${OUTPUT_DIR}/${IMAGE_NAME}-${{ env.BUILD_VERSION }}.img"
        echo "IMAGE_FILE=$IMAGE_FILE" >> $GITHUB_ENV
        
        # Create sparse file
        dd if=/dev/zero of="$IMAGE_FILE" bs=1 count=0 seek=${{ env.IMAGE_SIZE }} status=progress
        
        if [ ! -f "$IMAGE_FILE" ]; then
          echo "::error::Failed to create image file"
          exit 1
        fi
        
        SIZE=$(du -h "$IMAGE_FILE" | cut -f1)
        echo "✅ Created: $IMAGE_FILE ($SIZE)"
    
    - name: Setup partitions
      id: partitions
      run: |
        echo "🔧 Setting up partitions..."
        
        # Find available loop device
        LOOP_DEV=$(sudo losetup -f)
        if [ -z "$LOOP_DEV" ]; then
          echo "::error::No available loop device"
          exit 1
        fi
        
        echo "Using loop device: $LOOP_DEV"
        echo "LOOP_DEV=$LOOP_DEV" >> $GITHUB_ENV
        
        # Setup loop device with retry
        for i in {1..3}; do
          if sudo losetup "$LOOP_DEV" "$IMAGE_FILE"; then
            echo "✅ Loop device attached"
            break
          fi
          echo "⚠️  Attempt $i failed, retrying..."
          sleep 2
          if [ $i -eq 3 ]; then
            echo "::error::Failed to attach loop device"
            exit 1
          fi
        done
        
        # Create partition table
        echo "Creating partition table..."
        sudo parted -s "$LOOP_DEV" mklabel msdos
        sudo parted -s "$LOOP_DEV" mkpart primary fat32 1MiB 513MiB
        sudo parted -s "$LOOP_DEV" mkpart primary ext4 513MiB 100%
        sudo parted -s "$LOOP_DEV" set 1 boot on
        
        # Force kernel to re-read partition table
        sudo partprobe "$LOOP_DEV"
        sleep 3
        
        # Use kpartx for partition mapping
        echo "Mapping partitions with kpartx..."
        sudo kpartx -av "$LOOP_DEV"
        sleep 2
        
        # Determine partition devices
        LOOP_BASE=$(basename "$LOOP_DEV")
        BOOT_DEV="/dev/mapper/${LOOP_BASE}p1"
        ROOT_DEV="/dev/mapper/${LOOP_BASE}p2"
        
        # Verify devices exist
        for i in {1..10}; do
          if [ -e "$BOOT_DEV" ] && [ -e "$ROOT_DEV" ]; then
            echo "✅ Partition devices available"
            break
          fi
          echo "⏳ Waiting for partition devices... ($i/10)"
          sleep 1
          if [ $i -eq 10 ]; then
            echo "::error::Partition devices not available"
            sudo kpartx -l "$LOOP_DEV"
            exit 1
          fi
        done
        
        echo "BOOT_DEV=$BOOT_DEV" >> $GITHUB_ENV
        echo "ROOT_DEV=$ROOT_DEV" >> $GITHUB_ENV
        
        # Format partitions
        echo "Formatting boot partition (FAT32)..."
        sudo mkfs.vfat -F 32 -n BOOT "$BOOT_DEV"
        
        echo "Formatting root partition (ext4)..."
        sudo mkfs.ext4 -F -L rootfs "$ROOT_DEV"
        
        echo "✅ Partitions created and formatted"
        sudo lsblk "$LOOP_DEV"
    
    - name: Mount partitions
      run: |
        echo "📂 Mounting partitions..."
        
        # Mount with verification
        if ! sudo mount "$ROOT_DEV" "$WORK_DIR/root"; then
          echo "::error::Failed to mount root partition"
          exit 1
        fi
        
        if ! sudo mount "$BOOT_DEV" "$WORK_DIR/boot"; then
          echo "::error::Failed to mount boot partition"
          sudo umount "$WORK_DIR/root" || true
          exit 1
        fi
        
        # Verify mounts
        if ! mountpoint -q "$WORK_DIR/root"; then
          echo "::error::Root not mounted"
          exit 1
        fi
        
        if ! mountpoint -q "$WORK_DIR/boot"; then
          echo "::error::Boot not mounted"
          exit 1
        fi
        
        echo "✅ Partitions mounted"
        df -h | grep -E "boot|root"
    
    - name: Extract base system
      run: |
        echo "📦 Extracting Arch Linux ARM base system..."
        
        # Extract with progress
        # Note: Warnings about "LIBARCHIVE.xattr" are harmless and can be ignored
        set +e  # Don't exit on tar warnings
        pv ArchLinuxARM-rpi-aarch64-latest.tar.gz | \
          sudo tar -xzpf - -C "$WORK_DIR/root" --numeric-owner
        TAR_EXIT=$?
        set -e
        
        # Check if extraction actually failed (vs just warnings)
        if [ $TAR_EXIT -ne 0 ] && [ $TAR_EXIT -ne 1 ]; then
          echo "::error::Tar extraction failed with code $TAR_EXIT"
          exit 1
        fi
        
        # Verify extraction
        if [ ! -d "$WORK_DIR/root/usr" ] || [ ! -d "$WORK_DIR/root/etc" ]; then
          echo "::error::Base system extraction incomplete"
          exit 1
        fi
        
        echo "✅ Base system extracted"
        sudo du -sh "$WORK_DIR/root" 2>/dev/null || echo "Size: ~2.5GB"
    
    - name: Prepare chroot environment
      run: |
        echo "🔧 Preparing chroot environment..."
        
        # Copy QEMU binary
        sudo cp /usr/bin/qemu-aarch64-static "$WORK_DIR/root/usr/bin/"
        sudo chmod +x "$WORK_DIR/root/usr/bin/qemu-aarch64-static"
        
        # Setup DNS
        sudo cp /etc/resolv.conf "$WORK_DIR/root/etc/resolv.conf"
        
        # Disable pacman sandboxing for GitHub Actions compatibility
        echo "Disabling pacman sandboxing..."
        sudo sed -i 's/^#*DisableSandbox.*/DisableSandbox/' "$WORK_DIR/root/etc/pacman.conf"
        if ! grep -q "^DisableSandbox" "$WORK_DIR/root/etc/pacman.conf"; then
          echo "DisableSandbox" | sudo tee -a "$WORK_DIR/root/etc/pacman.conf"
        fi
        
        # Verify configuration
        if ! grep -q "^DisableSandbox" "$WORK_DIR/root/etc/pacman.conf"; then
          echo "::error::Failed to disable pacman sandboxing"
          exit 1
        fi
        
        echo "✅ Chroot environment prepared"
    
    - name: Configure system
      run: |
        set -e
        echo "⚙️  Configuring system (this takes 30-60 minutes)..."
        
        # Create comprehensive configuration script
        cat > config-system.sh << 'CHROOT_SCRIPT'
        #!/bin/bash
        set -euo pipefail
        
        # Logging
        exec > >(tee -a /var/log/build.log)
        exec 2>&1
        
        echo "=== Build started: $(date) ==="
        
        # Environment
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        export LANG=C
        export LC_ALL=C
        
        echo "=== Initializing Pacman ==="
        pacman-key --init
        pacman-key --populate archlinuxarm
        
        echo "=== Updating package databases ==="
        for i in {1..3}; do
          if pacman -Sy --noconfirm; then
            echo "✅ Database sync successful"
            break
          fi
          echo "⚠️  Sync attempt $i failed, retrying..."
          sleep 5
          if [ $i -eq 3 ]; then
            echo "ERROR: Failed to sync databases"
            exit 1
          fi
        done
        
        echo "=== Removing old kernel packages ==="
        pacman -R --noconfirm linux-aarch64 uboot-raspberrypi 2>/dev/null || true
        
        echo "=== Installing Raspberry Pi 5 kernel ==="
        pacman -S --noconfirm --overwrite "/boot/*" linux-rpi-16k linux-firmware || {
          echo "ERROR: Failed to install Pi5 kernel"
          exit 1
        }
        
        echo "=== Installing base system packages ==="
        pacman -S --noconfirm --needed \
          base-devel \
          git \
          vim \
          nano \
          wget \
          curl \
          sudo \
          networkmanager \
          openssh \
          htop \
          neofetch || {
          echo "ERROR: Failed to install base packages"
          exit 1
        }
        
        echo "=== Installing GNOME core ==="
        pacman -S --noconfirm --needed \
          gnome-shell \
          gnome-control-center \
          gnome-terminal \
          nautilus \
          gdm \
          xorg-server \
          mesa || {
          echo "ERROR: Failed to install GNOME core"
          exit 1
        }
        
        echo "=== Installing GNOME applications ==="
        pacman -S --noconfirm --needed \
          gnome-tweaks \
          gnome-system-monitor \
          file-roller \
          evince \
          eog \
          firefox || echo "⚠️  Some GNOME apps failed"
        
        echo "=== Installing audio system ==="
        pacman -S --noconfirm --needed \
          pipewire \
          pipewire-alsa \
          pipewire-pulse \
          wireplumber || echo "⚠️  Some audio packages failed"
        
        echo "=== Installing fonts ==="
        pacman -S --noconfirm --needed \
          noto-fonts \
          noto-fonts-cjk \
          noto-fonts-emoji \
          ttf-dejavu || echo "⚠️  Some fonts failed"
        
        echo "=== Configuring services ==="
        systemctl enable gdm
        systemctl enable NetworkManager
        systemctl enable sshd
        
        echo "=== Creating user ==="
        useradd -m -G wheel,video,audio,storage,input -s /bin/bash nyarch 2>/dev/null || true
        echo "nyarch:nyarch" | chpasswd
        
        echo "=== Configuring sudo ==="
        echo "%wheel ALL=(ALL:ALL) ALL" > /etc/sudoers.d/wheel
        chmod 440 /etc/sudoers.d/wheel
        
        echo "=== System configuration ==="
        echo "nyarch-pi5" > /etc/hostname
        
        cat > /etc/hosts << EOF
        127.0.0.1   localhost
        ::1         localhost
        127.0.1.1   nyarch-pi5.localdomain nyarch-pi5
        EOF
        
        echo "=== Locale configuration ==="
        echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
        locale-gen
        echo "LANG=en_US.UTF-8" > /etc/locale.conf
        
        echo "=== GNOME optimization ==="
        cat > /etc/profile.d/gnome-optimize.sh << 'EOF'
        export MUTTER_DEBUG_FORCE_KMS_MODE=simple
        export WEBKIT_DISABLE_COMPOSITING_MODE=1
        EOF
        chmod +x /etc/profile.d/gnome-optimize.sh
        
        echo "=== Cleaning package cache ==="
        pacman -Scc --noconfirm || true
        rm -rf /var/cache/pacman/pkg/*
        
        echo "=== Build completed: $(date) ==="
        echo "✅ Configuration successful"
        CHROOT_SCRIPT
        
        # Copy script
        sudo cp config-system.sh "$WORK_DIR/root/root/config-system.sh"
        sudo chmod +x "$WORK_DIR/root/root/config-system.sh"
        
        # Mount system directories
        echo "Mounting system directories..."
        sudo mount --bind /dev "$WORK_DIR/root/dev"
        sudo mount --bind /dev/pts "$WORK_DIR/root/dev/pts"
        sudo mount --bind /proc "$WORK_DIR/root/proc"
        sudo mount --bind /sys "$WORK_DIR/root/sys"
        
        # Run configuration with proper error handling
        echo "Running system configuration..."
        if ! sudo chroot "$WORK_DIR/root" /root/config-system.sh; then
          echo "::error::System configuration failed"
          # Copy build log for debugging
          sudo cp "$WORK_DIR/root/var/log/build.log" "$LOG_DIR/" 2>/dev/null || true
          exit 1
        fi
        
        # Copy build log
        sudo cp "$WORK_DIR/root/var/log/build.log" "$LOG_DIR/" 2>/dev/null || true
        
        echo "✅ System configured successfully"
    
    - name: Configure boot
      run: |
        echo "🥾 Configuring boot..."
        
        # Move boot files
        echo "Moving boot files..."
        sudo mv "$WORK_DIR/root/boot/"* "$WORK_DIR/boot/" 2>/dev/null || true
        
        # Verify kernel exists
        if [ ! -f "$WORK_DIR/boot/kernel_2712.img" ]; then
          echo "::error::Pi5 kernel not found in boot partition"
          ls -la "$WORK_DIR/boot/"
          exit 1
        fi
        
        # Create config.txt
        echo "Creating config.txt..."
        sudo tee "$WORK_DIR/boot/config.txt" > /dev/null << 'EOF'
        [pi5]
        kernel=kernel_2712.img
        
        # Display
        hdmi_force_hotplug=1
        disable_overscan=1
        
        # Memory
        gpu_mem=256
        
        # Audio
        dtparam=audio=on
        
        # System
        arm_64bit=1
        enable_uart=1
        
        # Performance (safe overclock)
        over_voltage=2
        arm_freq=2400
        
        [all]
        EOF
        
        # Create cmdline.txt
        echo "Creating cmdline.txt..."
        sudo tee "$WORK_DIR/boot/cmdline.txt" > /dev/null << 'EOF'
        console=serial0,115200 console=tty1 root=/dev/mmcblk0p2 rootfstype=ext4 elevator=deadline fsck.repair=yes rootwait quiet splash
        EOF
        
        # Verify boot configuration
        if [ ! -f "$WORK_DIR/boot/config.txt" ] || [ ! -f "$WORK_DIR/boot/cmdline.txt" ]; then
          echo "::error::Boot configuration files missing"
          exit 1
        fi
        
        echo "✅ Boot configuration complete"
        ls -lh "$WORK_DIR/boot/"
    
    - name: Add branding and build info
      run: |
        echo "🎨 Adding NyarchLinux branding..."
        
        # MOTD
        sudo tee "$WORK_DIR/root/etc/motd" > /dev/null << 'EOF'
          _   _                      _     _      _                  
         | \ | |                    | |   | |    (_)                 
         |  \| |_   _  __ _ _ __ ___| |__ | |     _ _ __  _   ___  __
         | . ` | | | |/ _` | '__/ __| '_ \| |    | | '_ \| | | \ \/ /
         | |\  | |_| | (_| | | | (__| | | | |____| | | | | |_| |>  < 
         |_| \_|\__, |\__,_|_|  \___|_| |_|______|_|_| |_|\__,_/_/\_\
                 __/ |                                                
                |___/   for Raspberry Pi 5
        
        Welcome to NyarchLinux Pi5 Edition!
        
        Default credentials: nyarch / nyarch
        ⚠️  CHANGE PASSWORD: passwd
        
        GitHub: https://github.com/NyarchLinux/NyarchLinux
        EOF
        
        # Issue
        sudo tee "$WORK_DIR/root/etc/issue" > /dev/null << 'EOF'
        NyarchLinux Pi5 \r (\l)
        
        EOF
        
        # Build info
        sudo tee "$WORK_DIR/root/etc/nyarch-build-info" > /dev/null << EOF
        Build Version: ${{ env.BUILD_VERSION }}
        Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Build Host: GitHub Actions
        Commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        Workflow: ${{ github.workflow }}
        Run: ${{ github.run_number }}
        EOF
        
        echo "✅ Branding added"
    
    - name: Cleanup chroot
      if: always()
      run: |
        echo "🧹 Cleaning up chroot environment..."
        
        # Unmount system directories
        sudo umount "$WORK_DIR/root/sys" 2>/dev/null || true
        sudo umount "$WORK_DIR/root/proc" 2>/dev/null || true
        sudo umount "$WORK_DIR/root/dev/pts" 2>/dev/null || true
        sudo umount "$WORK_DIR/root/dev" 2>/dev/null || true
        
        # Remove QEMU binary
        sudo rm -f "$WORK_DIR/root/usr/bin/qemu-aarch64-static"
        sudo rm -f "$WORK_DIR/root/root/config-system.sh"
        
        echo "✅ Chroot cleanup complete"
    
    - name: Sync and unmount
      if: always()
      run: |
        echo "💾 Syncing and unmounting filesystems..."
        
        # Sync all writes
        sudo sync
        sleep 2
        
        # Unmount filesystems
        sudo umount "$WORK_DIR/boot" 2>/dev/null || true
        sudo umount "$WORK_DIR/root" 2>/dev/null || true
        
        # Remove kpartx mappings
        sudo kpartx -d "$LOOP_DEV" 2>/dev/null || true
        
        # Detach loop device
        sudo losetup -d "$LOOP_DEV" 2>/dev/null || true
        
        echo "✅ Filesystems unmounted"
    
    - name: Validate image
      if: ${{ github.event.inputs.skip_tests != 'true' }}
      run: |
        echo "🔍 Validating image..."
        
        # Check file exists and has content
        if [ ! -f "$IMAGE_FILE" ]; then
          echo "::error::Image file not found"
          exit 1
        fi
        
        SIZE=$(stat -c%s "$IMAGE_FILE")
        if [ $SIZE -lt 1000000000 ]; then  # Less than 1GB is suspicious
          echo "::error::Image file too small: $SIZE bytes"
          exit 1
        fi
        
        echo "✅ Image size: $(du -h "$IMAGE_FILE" | cut -f1)"
        
        # Mount and verify structure
        echo "Verifying image structure..."
        TEMP_LOOP=$(sudo losetup -f)
        sudo losetup "$TEMP_LOOP" "$IMAGE_FILE"
        sudo kpartx -av "$TEMP_LOOP"
        sleep 2
        
        TEMP_ROOT="/tmp/verify_root"
        TEMP_BOOT="/tmp/verify_boot"
        mkdir -p "$TEMP_ROOT" "$TEMP_BOOT"
        
        LOOP_BASE=$(basename "$TEMP_LOOP")
        sudo mount "/dev/mapper/${LOOP_BASE}p2" "$TEMP_ROOT"
        sudo mount "/dev/mapper/${LOOP_BASE}p1" "$TEMP_BOOT"
        
        # Check critical files
        ERRORS=0
        
        if [ ! -f "$TEMP_BOOT/kernel_2712.img" ]; then
          echo "::error::Kernel missing from boot partition"
          ERRORS=$((ERRORS+1))
        fi
        
        if [ ! -f "$TEMP_BOOT/config.txt" ]; then
          echo "::error::config.txt missing"
          ERRORS=$((ERRORS+1))
        fi
        
        if [ ! -d "$TEMP_ROOT/usr" ]; then
          echo "::error::/usr directory missing"
          ERRORS=$((ERRORS+1))
        fi
        
        if [ ! -f "$TEMP_ROOT/etc/hostname" ]; then
          echo "::error::hostname not configured"
          ERRORS=$((ERRORS+1))
        fi
        
        # Cleanup validation
        sudo umount "$TEMP_BOOT"
        sudo umount "$TEMP_ROOT"
        sudo kpartx -d "$TEMP_LOOP"
        sudo losetup -d "$TEMP_LOOP"
        rmdir "$TEMP_ROOT" "$TEMP_BOOT"
        
        if [ $ERRORS -gt 0 ]; then
          echo "::error::Image validation failed with $ERRORS errors"
          exit 1
        fi
        
        echo "✅ Image validation passed"
    
    - name: Compress image
      run: |
        echo "🗜️  Compressing image..."
        
        cd "$OUTPUT_DIR"
        IMAGE=$(basename "$IMAGE_FILE")
        
        # Compress with pigz (parallel gzip) then xz
        echo "Compressing with xz (high compression)..."
        if ! pv "$IMAGE" | xz -9 -T0 > "${IMAGE}.xz"; then
          echo "::error::Compression failed"
          exit 1
        fi
        
        # Remove uncompressed image to save space
        rm "$IMAGE"
        
        COMPRESSED="${IMAGE}.xz"
        if [ ! -f "$COMPRESSED" ]; then
          echo "::error::Compressed file not found"
          exit 1
        fi
        
        echo "✅ Compressed: $COMPRESSED"
        ls -lh "$COMPRESSED"
        
        # Calculate compression ratio
        ORIGINAL_SIZE=$(stat -c%s "$IMAGE_FILE")
        COMPRESSED_SIZE=$(stat -c%s "$COMPRESSED")
        RATIO=$(awk "BEGIN {printf \"%.1f\", ($ORIGINAL_SIZE / $COMPRESSED_SIZE)}")
        echo "📊 Compression ratio: ${RATIO}:1"
    
    - name: Generate checksums
      run: |
        echo "🔐 Generating checksums..."
        
        cd "$OUTPUT_DIR"
        
        # Generate multiple checksums for verification
        sha256sum *.img.xz > SHA256SUMS
        sha512sum *.img.xz > SHA512SUMS
        md5sum *.img.xz > MD5SUMS
        
        echo "✅ Checksums generated:"
        cat SHA256SUMS
        cat SHA512SUMS
        cat MD5SUMS
    
    - name: Create build report
      if: always()
      run: |
        echo "📄 Creating build report..."
        
        cat > "$OUTPUT_DIR/BUILD_REPORT.txt" << EOF
        NyarchLinux Raspberry Pi 5 Build Report
        ========================================
        
        Build Information:
        - Version: ${{ env.BUILD_VERSION }}
        - Date: $(date -u)
        - Workflow: ${{ github.workflow }}
        - Run Number: ${{ github.run_number }}
        - Commit: ${{ github.sha }}
        - Branch: ${{ github.ref_name }}
        - Triggered by: ${{ github.event_name }}
        
        Configuration:
        - Image Size: ${{ env.IMAGE_SIZE }}
        - Base: Arch Linux ARM (aarch64)
        - Kernel: linux-rpi-16k
        - Desktop: GNOME
        
        Build Status: ${{ job.status }}
        
        Default Credentials:
        - Username: nyarch
        - Password: nyarch
        ⚠️  MUST BE CHANGED ON FIRST BOOT
        
        Installation:
        1. Download the .img.xz file
        2. Extract: xz -d NyarchLinux-Pi5-*.img.xz
        3. Flash: sudo dd if=NyarchLinux-Pi5-*.img of=/dev/sdX bs=4M status=progress
        4. Insert SD card into Pi5 and boot
        
        First Boot:
        - Boot time: ~60-90 seconds
        - Login with nyarch/nyarch
        - Run: passwd (to change password)
        - Run: sudo pacman -Syu (to update system)
        
        Support:
        - GitHub: https://github.com/NyarchLinux/NyarchLinux
        - Discord: https://discord.gg/xuw6BNXXE7
        
        Checksums:
        $(cat "$OUTPUT_DIR/SHA256SUMS" 2>/dev/null || echo "Not available")
        
        Build Artifacts:
        $(ls -lh "$OUTPUT_DIR" 2>/dev/null || echo "Not available")
        
        ========================================
        EOF
        
        echo "✅ Build report created"
        cat "$OUTPUT_DIR/BUILD_REPORT.txt"
    
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          logs/
        retention-days: 14
    
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_NAME }}-${{ env.BUILD_VERSION }}
        path: |
          output/*.img.xz
          output/*SUMS
          output/BUILD_REPORT.txt
        retention-days: 30
        compression-level: 0  # Already compressed
    
    - name: Create release
      if: |
        (github.event.inputs.release == 'true' || startsWith(github.ref, 'refs/tags/')) &&
        success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.BUILD_VERSION }}
        name: NyarchLinux Pi5 ${{ env.BUILD_VERSION }}
        body_path: output/BUILD_REPORT.txt
        files: |
          output/*.img.xz
          output/*SUMS
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Final status report
      if: always()
      run: |
        echo "========================================"
        echo "Build Summary"
        echo "========================================"
        echo "Status: ${{ job.status }}"
        echo "Version: ${{ env.BUILD_VERSION }}"
        echo "Duration: ${{ job.duration }} minutes"
        echo "========================================"
        
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ BUILD SUCCESSFUL!"
          echo "📦 Image: $(ls output/*.img.xz 2>/dev/null || echo 'Not found')"
          echo "📊 Size: $(du -h output/*.img.xz 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "🔐 SHA256: $(cat output/SHA256SUMS 2>/dev/null || echo 'Not found')"
        else
          echo "❌ BUILD FAILED!"
          echo "Check logs above for details"
          exit 1
        fi
